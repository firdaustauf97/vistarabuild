<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Vistara Build</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#13283a">

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="../assets/uploads/favicon-32.png"
  >

  <style>
    :root {
      --vb-navy: #13283a;
      --vb-navy-dark: #0c1a26;
      --vb-gold: #c9aa75;
      --vb-bg: #f5f7fa;
      --vb-card: #ffffff;
      --vb-border: #e5e9ef;
      --vb-text: #1f2937;
      --vb-muted: #6b7280;
      --vb-radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top right, rgba(201, 170, 117, 0.14), transparent 28%),
        linear-gradient(145deg, var(--vb-navy-dark), var(--vb-navy));
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .admin-loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .admin-loading-card {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    .admin-loading-logo {
      display: block;
      width: 200px;
      max-width: 82%;
      margin: 0 auto 22px;
      height: auto;
    }

    .admin-loading h1 {
      margin: 0;
      color: #ffffff;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
    }

    .admin-loading p {
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.6;
    }

    .loading-line {
      width: 150px;
      height: 4px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      margin: 24px auto 0;
      position: relative;
    }

    .loading-line::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 50%;
      background: var(--vb-gold);
      border-radius: inherit;
      animation: loading 1.2s ease-in-out infinite;
    }

    @keyframes loading {
      from { transform: translateX(-110%); }
      to { transform: translateX(220%); }
    }
  </style>
</head>

<body>
  <div class="admin-loading" id="adminLoading">
    <div class="admin-loading-card">
      <img
        class="admin-loading-logo"
        src="../assets/uploads/logo-vistara-full.png"
        alt="Vistara Build"
      >

      <h1>Panel Admin Vistara Build</h1>

      <p>
        Kelola konten website, layanan, proyek, testimoni,
        dan FAQ dengan lebih rapi.
      </p>

      <div class="loading-line" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    window.CMS_MANUAL_INIT = true;
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    CMS.init();

    const customStyle = document.createElement("style");
    customStyle.innerHTML = `
      body {
        background: #f5f7fa !important;
      }

      [class*="AppHeader"],
      [class*="ToolbarContainer"],
      [class*="CollectionTopContainer"] {
        background: #ffffff !important;
        border-bottom: 1px solid #e5e9ef !important;
        box-shadow: none !important;
      }

      [class*="SidebarContainer"] {
        background: #ffffff !important;
        border-right: 1px solid #e5e9ef !important;
      }

      [class*="EditorContainer"],
      [class*="PaneContainer"],
      [class*="CollectionContainer"] {
        background: #f5f7fa !important;
      }

      [class*="Card"],
      [class*="ListCard"],
      [class*="ControlPaneContainer"] {
        border-radius: 16px !important;
      }

      button {
        border-radius: 12px !important;
      }
    `;
    document.head.appendChild(customStyle);

    const loadingScreen = document.getElementById("adminLoading");

    const observer = new MutationObserver(function () {
      const appReady =
        document.querySelector("#nc-root") ||
        document.querySelector("[class*='App']") ||
        document.querySelector("[class*='Login']");

      if (appReady && loadingScreen) {
        loadingScreen.style.display = "none";
        observer.disconnect();
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });

    setTimeout(function () {
      if (loadingScreen) {
        loadingScreen.style.display = "none";
      }
    }, 5000);
  </script>
</body>
</html>
