locale: "id"

logo_url: "https://firdaustauf97.github.io/vistarabuild/assets/uploads/logo-vistara-full.png"

site_url: "https://firdaustauf97.github.io/vistarabuild/"
display_url: "https://firdaustauf97.github.io/vistarabuild/"

show_preview_links: true

backend:
  name: github
  repo: firdaustauf97/vistarabuild
  branch: main
  base_url: https://vistara-build-oauth.firdauscdps.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo

publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "website"
    label: "Kelola Website"

    files:
      - name: "general"
        label: "Identitas dan Konten Utama"
        file: "_data/site.yml"

        editor:
          preview: false

        fields:
          - label: "Nama Bisnis"
            name: "brand"
            widget: "string"

          - label: "Logo Header atau Monogram"
            name: "logo_mark"
            widget: "image"
            required: false
            hint: "Gunakan logo berbentuk simbol dengan latar transparan."

          - label: "Logo Lengkap"
            name: "logo_full"
            widget: "image"
            required: false
            hint: "Gunakan logo lengkap Vistara Build untuk footer dan identitas website."

          - label: "Favicon 32 px"
            name: "favicon_32"
            widget: "image"
            required: false

          - label: "Favicon 192 px"
            name: "favicon_192"
            widget: "image"
            required: false

          - label: "Favicon 512 px"
            name: "favicon_512"
            widget: "image"
            required: false

          - label: "Tagline"
            name: "tagline"
            widget: "string"
            hint: "Contoh: Kontraktor Renovasi Yogyakarta"

          - label: "Judul Utama"
            name: "hero_title"
            widget: "string"
            hint: "Judul utama yang pertama kali dilihat pengunjung."

          - label: "Deskripsi Utama"
            name: "hero_description"
            widget: "text"
            hint: "Jelaskan fokus layanan Vistara Build secara singkat."

          - label: "Teks Tombol WhatsApp"
            name: "hero_button"
            widget: "string"

          - label: "Judul Penjelasan Tembok Lembap"
            name: "about_title"
            widget: "string"

          - label: "Penjelasan Tembok Lembap"
            name: "about_description"
            widget: "text"

          - label: "Nomor WhatsApp"
            name: "whatsapp"
            widget: "string"
            required: false
            hint: "Gunakan format 6281234567890 tanpa tanda tambah, spasi, atau angka 0 di depan."

          - label: "Nomor Telepon yang Ditampilkan"
            name: "phone_display"
            widget: "string"
            hint: "Contoh: 0812-3456-7890"

          - label: "Nomor untuk Link Telepon"
            name: "phone_link"
            widget: "string"
            required: false
            hint: "Contoh: +6281234567890"

          - label: "Alamat atau Area Layanan"
            name: "address"
            widget: "text"

          - label: "Judul SEO"
            name: "seo_title"
            widget: "string"
            hint: "Judul yang muncul pada hasil pencarian Google."

          - label: "Deskripsi SEO"
            name: "seo_description"
            widget: "text"
            hint: "Ringkasan singkat website untuk hasil pencarian Google."

      - name: "services"
        label: "Daftar Layanan"
        file: "_data/services.yml"

        editor:
          preview: false

        fields:
          - label: "Daftar Layanan"
            name: "items"
            widget: "list"
            label_singular: "Layanan"
            summary: "{{fields.title}}"
            collapsed: true

            fields:
              - label: "Jenis Ikon"
                name: "icon"
                widget: "select"
                default: "tools"

                options:
                  - label: "Tetes Air"
                    value: "water"

                  - label: "Pengecatan"
                    value: "paint"

                  - label: "Waterproofing"
                    value: "waterproof"

                  - label: "Atap"
                    value: "roof"

                  - label: "Kamar Mandi"
                    value: "bathroom"

                  - label: "Renovasi"
                    value: "tools"

              - label: "Nama Layanan"
                name: "title"
                widget: "string"

              - label: "Deskripsi Layanan"
                name: "description"
                widget: "text"
                hint: "Jelaskan layanan secara singkat dan mudah dipahami calon pelanggan."

      - name: "projects"
        label: "Portofolio Proyek"
        file: "_data/projects.yml"

        editor:
          preview: false

        fields:
          - label: "Daftar Proyek"
            name: "items"
            widget: "list"
            label_singular: "Proyek"
            summary: "{{fields.title}} - {{fields.location}}"
            collapsed: true

            fields:
              - label: "Judul Proyek"
                name: "title"
                widget: "string"
                hint: "Contoh: Treatment Tembok Lembap"

              - label: "Lokasi"
                name: "location"
                widget: "string"
                hint: "Contoh: Sleman, Yogyakarta"

              - label: "Deskripsi Singkat"
                name: "description"
                widget: "text"
                hint: "Jelaskan masalah, pekerjaan yang dilakukan, dan hasil akhirnya."

              - label: "Jenis Media"
                name: "media_type"
                widget: "select"
                default: "image"

                options:
                  - label: "Foto"
                    value: "image"

                  - label: "Video YouTube"
                    value: "youtube"

              - label: "Foto Proyek"
                name: "image"
                widget: "image"
                required: false
                hint: "Unggah foto bila memilih jenis media Foto."

              - label: "URL Video YouTube"
                name: "video_url"
                widget: "string"
                required: false
                hint: "Isi bila memilih Video YouTube. Video Unlisted disarankan."

      - name: "testimonials"
        label: "Testimoni Pelanggan"
        file: "_data/testimonials.yml"

        editor:
          preview: false

        fields:
          - label: "Daftar Testimoni"
            name: "items"
            widget: "list"
            label_singular: "Testimoni"
            summary: "{{fields.name}} - {{fields.project}}"
            collapsed: true

            fields:
              - label: "Nama Pelanggan"
                name: "name"
                widget: "string"

              - label: "Jenis Pekerjaan"
                name: "project"
                widget: "string"

              - label: "Isi Testimoni"
                name: "quote"
                widget: "text"
                hint: "Gunakan testimoni asli dari pelanggan."

      - name: "faq"
        label: "Pertanyaan Umum"
        file: "_data/faq.yml"

        editor:
          preview: false

        fields:
          - label: "Daftar Pertanyaan"
            name: "items"
            widget: "list"
            label_singular: "Pertanyaan"
            summary: "{{fields.question}}"
            collapsed: true

            fields:
              - label: "Pertanyaan"
                name: "question"
                widget: "string"

              - label: "Jawaban"
                name: "answer"
                widget: "text"
