items:
  - question: "Apakah tembok lembap cukup dicat ulang?"
    answer: "Tidak selalu. Sumber kelembapan sebaiknya diperiksa terlebih dahulu agar masalah tidak cepat muncul kembali."

  - question: "Apakah tersedia survei lokasi?"
    answer: "Tersedia sesuai jadwal dan area pelayanan. Hubungi Vistara Build untuk konfirmasi lokasi dan waktu survei."

  - question: "Berapa biaya treatment tembok lembap?"
    answer: "Biaya bergantung pada penyebab, luas area, kondisi lapisan tembok, serta metode penanganan yang diperlukan."

  - question: "Apakah melayani renovasi selain pengecatan?"
    answer: "Ya. Vistara Build juga melayani waterproofing, perbaikan atap, kamar mandi, dan pekerjaan renovasi rumah lainnya."