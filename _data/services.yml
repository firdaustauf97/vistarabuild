items:
  - icon: "💧"
    title: "Treatment Tembok Lembap"
    description: "Pemeriksaan kondisi tembok, identifikasi kemungkinan sumber air, perbaikan lapisan, dan treatment sesuai kebutuhan."

  - icon: "🎨"
    title: "Pengecatan Tembok"
    description: "Persiapan permukaan, perbaikan retak ringan, aplikasi primer, serta pengecatan interior dan eksterior."

  - icon: "☔"
    title: "Waterproofing"
    description: "Penanganan area rawan rembes seperti dak, dinding luar, balkon, dan kamar mandi."

  - icon: "🏠"
    title: "Perbaikan Atap"
    description: "Pemeriksaan kebocoran dan perbaikan bagian yang menjadi jalur masuknya air."

  - icon: "🚿"
    title: "Renovasi Kamar Mandi"
    description: "Pembaruan lantai, dinding, sanitasi, waterproofing, dan tata ruang kamar mandi."

  - icon: "🛠️"
    title: "Renovasi Rumah"
    description: "Perbaikan dan renovasi berbagai bagian rumah sesuai kebutuhan dan kondisi bangunan."
