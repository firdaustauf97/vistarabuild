  - title: Treatment Tembok Lembap Dapur
    location: Sleman, Yogyakarta
    category: lembap
    description: >
      Treatment menyeluruh pada tembok dapur yang mengalami kelembapan tinggi
      dan cat mengelupas. Identifikasi sumber air, aplikasi bahan anti lembap,
      dan pengecatan ulang. Masalah teratasi tuntas.
